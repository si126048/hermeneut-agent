<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HERMENEUT · 对抗性话语分析终端</title>
<style>
:root {
  --paper: #eeede6;
  --ink: #252722;
  --panel: rgba(26,28,23,0.92);
  --panel-text: #c8c9b8;
  --gold: #f0c648;
  --orange: #d95023;
  --cyan: #48b8a0;
  --grid: rgba(37,39,34,0.08);
  --border: rgba(37,39,34,0.25);
  --font-main: 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'Source Code Pro', monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-main);
  font-size: 15px;
  color: var(--ink);
  background: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 8px 8px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── HEADER ── */
.header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--paper);
  z-index: 10;
  flex-shrink: 0;
}
.header-logo { display: flex; align-items: center; gap: 8px; }
.header-logo svg { width: 28px; height: 28px; }
.header-title {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.header-sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: rgba(37,39,34,0.5);
  margin-left: 4px;
}
.header-right {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 11px;
  color: rgba(37,39,34,0.5);
}

/* ── MAIN LAYOUT ── */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── SEC-01: ANALYSIS PANEL ── */
.sec-analysis {
  flex: 1;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  min-width: 0;
}
.sec-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(37,39,34,0.4);
  padding: 8px 16px 4px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sec-label span { color: var(--gold); }

/* ── OUTPUT AREA ── */
.output {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.output::-webkit-scrollbar { width: 4px; }
.output::-webkit-scrollbar-thumb { background: var(--border); }

/* ── RESULT CARDS ── */
.card {
  position: relative;
  background: var(--panel);
  color: var(--panel-text);
  padding: 14px 16px;
  border-left: 3px solid var(--cyan);
  font-size: 13px;
  line-height: 1.7;
  animation: cardIn 0.4s var(--ease);
}
.card.hyp { border-left-color: var(--gold); }
.card.cross { border-left-color: var(--orange); }
.card.synth { border-left-color: var(--panel-text); border-left-style: dashed; }
.card-tag {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--gold);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.card-tag .dot {
  width: 6px; height: 6px;
  background: var(--cyan);
  display: inline-block;
}
.card.hyp .card-tag .dot { background: var(--gold); }
.card.cross .card-tag .dot { background: var(--orange); }
.card-text { white-space: pre-wrap; word-break: break-word; }
.card-meta {
  font-family: var(--font-mono);
  font-size: 10px;
  color: rgba(200,201,184,0.5);
  margin-top: 8px;
}
.card-meta .status-ok { color: var(--cyan); }
.card-meta .status-warn { color: var(--orange); }

@keyframes cardIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── USER MESSAGE ── */
.msg-user {
  padding: 10px 16px;
  background: rgba(37,39,34,0.06);
  border-left: 3px solid var(--ink);
  font-size: 14px;
  line-height: 1.6;
  animation: cardIn 0.3s var(--ease);
}
.msg-user::before {
  content: '>';
  font-family: var(--font-mono);
  color: var(--gold);
  margin-right: 8px;
  font-weight: 700;
}

/* ── PHASE PROGRESS ── */
.phase-bar {
  display: flex;
  gap: 2px;
  padding: 10px 16px;
  background: var(--panel);
  animation: cardIn 0.3s var(--ease);
}
.phase-step {
  flex: 1;
  height: 3px;
  background: rgba(200,201,184,0.15);
  position: relative;
}
.phase-step.active { background: var(--gold); }
.phase-step.done { background: var(--cyan); }
.phase-label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--panel-text);
  padding: 4px 16px 0;
  background: var(--panel);
  display: flex;
  justify-content: space-between;
}
.phase-label span { opacity: 0.4; }
.phase-label span.active { opacity: 1; color: var(--gold); }
.phase-label span.done { opacity: 0.7; color: var(--cyan); }

/* ── LOADING ── */
.loading {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  background: var(--panel);
  color: var(--panel-text);
  font-family: var(--font-mono);
  font-size: 11px;
  animation: cardIn 0.3s var(--ease);
}
.loading-dot {
  width: 6px; height: 6px;
  background: var(--gold);
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

/* ── INPUT AREA ── */
.input-area {
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  flex-shrink: 0;
  background: var(--paper);
}
.file-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.file-btn {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.5px;
  padding: 4px 10px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--ink);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: border-color 0.2s, color 0.2s;
}
.file-btn:hover { border-color: var(--gold); color: var(--gold); }
.file-btn svg { width: 14px; height: 14px; }
.file-name {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--olive);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 260px;
}
.file-name.has-file { color: var(--gold); }
.file-clear {
  font-family: var(--font-mono);
  font-size: 11px;
  background: none;
  border: none;
  color: var(--accent);
  cursor: pointer;
  padding: 2px 6px;
  display: none;
}
.file-clear.visible { display: inline; }
.input-row { display: flex; gap: 8px; margin-bottom: 8px; }
textarea {
  width: 100%;
  min-height: 72px;
  max-height: 200px;
  resize: vertical;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.5);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 10px 12px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
textarea:focus {
  border-color: var(--gold);
  box-shadow: inset 0 0 0 1px var(--gold);
}
textarea::placeholder { color: rgba(37,39,34,0.3); }
.btn-row { display: flex; gap: 8px; }
.btn {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 1px;
  padding: 8px 20px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  text-transform: uppercase;
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
  transition: all 0.2s;
}
.btn:hover { background: var(--ink); color: var(--paper); }
.btn:active { transform: scale(0.98); }
.btn.primary {
  background: var(--gold);
  border-color: var(--gold);
  color: var(--ink);
}
.btn.primary:hover { background: #d4ad2e; }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── SEC-02: SIDEBAR ── */
.sec-sidebar {
  width: 340px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  color: var(--panel-text);
}
.tab-bar {
  display: flex;
  border-bottom: 1px solid rgba(200,201,184,0.12);
  flex-shrink: 0;
}
.tab {
  flex: 1;
  padding: 10px 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  text-align: center;
  cursor: pointer;
  border: none;
  background: transparent;
  color: rgba(200,201,184,0.4);
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.tab:hover { color: var(--panel-text); }
.tab.active {
  color: var(--gold);
  border-bottom-color: var(--gold);
}
.tab svg { width: 14px; height: 14px; }
.tab-content {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}
.tab-content::-webkit-scrollbar { width: 3px; }
.tab-content::-webkit-scrollbar-thumb { background: rgba(200,201,184,0.2); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── PERSPECTIVE CARDS ── */
.persp-card {
  position: relative;
  padding: 14px;
  margin-bottom: 10px;
  border: 1px solid rgba(200,201,184,0.12);
  background: rgba(26,28,23,0.6);
}
.persp-card::before, .persp-card::after {
  content: '';
  position: absolute;
  width: 8px;
  height: 8px;
  border-color: rgba(200,201,184,0.25);
  border-style: solid;
}
.persp-card::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
.persp-card::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }
.persp-card.lacan { border-left: 2px solid var(--cyan); }
.persp-card.deleuze { border-left: 2px solid var(--orange); }
.persp-name {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.persp-card.lacan .persp-name { color: var(--cyan); }
.persp-card.deleuze .persp-name { color: var(--orange); }
.persp-symbol {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--gold);
  margin-left: 6px;
}
.persp-concepts {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin: 8px 0;
}
.concept-tag {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 2px 6px;
  background: rgba(200,201,184,0.08);
  border: 1px solid rgba(200,201,184,0.12);
  color: var(--panel-text);
}
.persp-blind {
  font-size: 11px;
  color: rgba(200,201,184,0.5);
  margin-top: 6px;
}
.persp-blind::before { content: '⚠ '; color: var(--orange); }

/* ── DOCUMENT PANEL ── */
.drop-zone {
  border: 1px dashed rgba(200,201,184,0.25);
  padding: 24px;
  text-align: center;
  margin-bottom: 12px;
  transition: all 0.2s;
  cursor: pointer;
}
.drop-zone:hover, .drop-zone.dragover {
  border-color: var(--gold);
  background: rgba(240,198,72,0.05);
}
.drop-zone svg { width: 36px; height: 36px; margin-bottom: 8px; opacity: 0.4; }
.drop-zone-text {
  font-family: var(--font-mono);
  font-size: 11px;
  color: rgba(200,201,184,0.5);
}
.drop-zone-hint {
  font-size: 10px;
  color: rgba(200,201,184,0.3);
  margin-top: 4px;
}
.doc-list { display: flex; flex-direction: column; gap: 6px; }
.doc-item {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 8px 10px;
  border: 1px solid rgba(200,201,184,0.08);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.doc-id { color: var(--gold); }
.doc-type { color: rgba(200,201,184,0.4); font-size: 10px; }

/* ── SEARCH PANEL ── */
.search-input-row { display: flex; gap: 6px; margin-bottom: 12px; }
.search-input {
  flex: 1;
  border: 1px solid rgba(200,201,184,0.15);
  background: rgba(26,28,23,0.6);
  color: var(--panel-text);
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 8px 10px;
  outline: none;
}
.search-input:focus { border-color: var(--gold); }
.search-input::placeholder { color: rgba(200,201,184,0.25); }
.search-btn {
  border: 1px solid rgba(200,201,184,0.15);
  background: transparent;
  color: var(--panel-text);
  padding: 8px 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  transition: all 0.2s;
}
.search-btn:hover { border-color: var(--gold); color: var(--gold); }
.search-btn svg { width: 16px; height: 16px; }
.search-result {
  padding: 8px 10px;
  border-left: 2px solid rgba(200,201,184,0.12);
  margin-bottom: 8px;
  font-size: 12px;
  line-height: 1.6;
}
.search-result-id {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--gold);
  margin-bottom: 2px;
}
.search-result mark {
  background: rgba(240,198,72,0.2);
  color: var(--gold);
  padding: 0 2px;
}
.no-data {
  font-family: var(--font-mono);
  font-size: 11px;
  color: rgba(200,201,184,0.3);
  text-align: center;
  padding: 24px;
}
.no-data::after {
  content: '▌';
  animation: blink 1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* ── FOOTER / TELEMETRY ── */
.footer {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 6px 16px;
  border-top: 1px solid var(--border);
  background: var(--paper);
  font-family: var(--font-mono);
  font-size: 10px;
  color: rgba(37,39,34,0.4);
  flex-shrink: 0;
}
.footer-item { display: flex; align-items: center; gap: 4px; }
.footer-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  display: inline-block;
}
.footer-dot.ok { background: var(--cyan); }
.footer-dot.warn { background: var(--gold); }
.footer-dot.err { background: var(--orange); }
.footer-sep { color: var(--border); }

/* ── FLOPPY ANIMATION ── */
@keyframes floppyIn {
  0% { transform: translateY(-20px); opacity: 0; }
  60% { transform: translateY(2px); opacity: 1; }
  100% { transform: translateY(0); opacity: 1; }
}
.floppy-anim { animation: floppyIn 0.6s var(--ease); }

/* ── ERROR CARD ── */
.card.error {
  border-left-color: var(--orange);
  background: rgba(217,80,35,0.08);
  color: var(--orange);
}

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  .main { flex-direction: column; }
  .sec-analysis { border-right: none; border-bottom: 1px solid var(--border); }
  .sec-sidebar { width: 100%; max-height: 40vh; }
}

/* ── EMPTY STATE ── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 12px;
  opacity: 0.3;
}
.empty-state svg { width: 48px; height: 48px; }
.empty-state-text {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* ── SECTION TITLE IN OUTPUT ── */
.section-title {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(37,39,34,0.35);
  padding: 8px 0 4px;
  border-bottom: 1px solid var(--border);
  margin-top: 8px;
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-logo">
    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="2" width="28" height="28" rx="0" stroke="var(--ink)" stroke-width="1.5" fill="none"/>
      <rect x="8" y="2" width="16" height="10" rx="0" stroke="var(--ink)" stroke-width="1" fill="var(--paper)"/>
      <rect x="12" y="4" width="8" height="5" rx="0" fill="var(--ink)"/>
      <rect x="6" y="16" width="20" height="12" rx="0" fill="var(--ink)" opacity="0.08"/>
      <rect x="18" y="18" width="6" height="3" rx="0" fill="var(--gold)"/>
    </svg>
    <span class="header-title">Hermeneut</span>
    <span class="header-sub">v2.2</span>
  </div>
  <span class="header-sub" style="margin-left:8px">对抗性话语分析终端</span>
  <span class="header-right">LACAN × DELEUZE</span>
</header>

<!-- MAIN -->
<div class="main">
  <!-- SEC-01: ANALYSIS -->
  <section class="sec-analysis">
    <div class="sec-label"><span>SEC-01</span> · 分析终端</div>
    <div class="output" id="output">
      <div class="empty-state" id="empty-state">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="6" y="6" width="36" height="36" stroke="var(--ink)" stroke-width="1" fill="none"/>
          <rect x="12" y="6" width="24" height="14" stroke="var(--ink)" stroke-width="0.8" fill="none"/>
          <rect x="17" y="9" width="14" height="7" fill="var(--ink)" opacity="0.1"/>
          <rect x="10" y="24" width="28" height="14" stroke="var(--ink)" stroke-width="0.5" fill="none" stroke-dasharray="2 2"/>
          <rect x="26" y="27" width="8" height="4" fill="var(--gold)" opacity="0.4"/>
        </svg>
        <span class="empty-state-text">输入文本以启动分析</span>
      </div>
    </div>
    <div class="input-area">
      <div class="file-row">
        <button class="file-btn" id="file-pick-btn">
          <svg viewBox="0 0 16 16" fill="none"><rect x="2" y="1" width="12" height="14" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="4" y="1" width="8" height="4" stroke="currentColor" stroke-width="0.8" fill="none"/><rect x="5.5" y="2" width="5" height="2" fill="currentColor" opacity="0.2"/><rect x="8" y="8" width="4" height="2" fill="currentColor" opacity="0.4"/></svg>
          附加文件
        </button>
        <span class="file-name" id="file-name-display">未选择文件</span>
        <button class="file-clear" id="file-clear-btn">✕ 移除</button>
        <input type="file" id="analysis-file-input" accept=".txt,.md,.pdf" style="display:none">
      </div>
      <textarea id="input-text" placeholder="在此输入待分析文本...&#10;支持中文、英文、法文等多语言文本&#10;或通过上方按钮附加 .txt / .md / .pdf 文件"></textarea>
      <div class="btn-row">
        <button class="btn primary" id="btn-analyze" onclick="runAnalyze()">▸ 分析</button>
        <button class="btn" id="btn-dialectical" onclick="runDialectical()">▸▸ 辩证分析</button>
      </div>
    </div>
  </section>

  <!-- SEC-02: SIDEBAR -->
  <aside class="sec-sidebar">
    <div class="sec-label" style="color:rgba(200,201,184,0.3)"><span style="color:var(--gold)">SEC-02</span> · 数据面板</div>
    <div class="tab-bar">
      <button class="tab active" data-tab="perspectives" onclick="switchTab('perspectives')">
        <svg viewBox="0 0 16 16" fill="none"><rect x="1" y="3" width="14" height="10" stroke="currentColor" stroke-width="1" fill="none"/><rect x="4" y="3" width="8" height="4" stroke="currentColor" stroke-width="0.6" fill="none"/><rect x="9" y="5" width="3" height="1.5" fill="currentColor" opacity="0.4"/></svg>
        视角
      </button>
      <button class="tab" data-tab="documents" onclick="switchTab('documents')">
        <svg viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="14" height="14" stroke="currentColor" stroke-width="1" fill="none"/><line x1="4" y1="5" x2="12" y2="5" stroke="currentColor" stroke-width="0.6"/><line x1="4" y1="8" x2="12" y2="8" stroke="currentColor" stroke-width="0.6"/><line x1="4" y1="11" x2="9" y2="11" stroke="currentColor" stroke-width="0.6"/></svg>
        文档
      </button>
      <button class="tab" data-tab="search" onclick="switchTab('search')">
        <svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1" fill="none"/><line x1="10.5" y1="10.5" x2="14" y2="14" stroke="currentColor" stroke-width="1"/><rect x="3" y="12" width="6" height="3" stroke="currentColor" stroke-width="0.5" fill="none" opacity="0.4"/></svg>
        搜索
      </button>
    </div>
    <div class="tab-content">
      <!-- PERSPECTIVES -->
      <div class="tab-panel active" id="panel-perspectives">
        <div class="no-data" id="persp-loading">LOADING...</div>
      </div>
      <!-- DOCUMENTS -->
      <div class="tab-panel" id="panel-documents">
        <div class="drop-zone" id="drop-zone">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="4" width="32" height="40" stroke="var(--panel-text)" stroke-width="1.5" fill="none"/>
            <rect x="14" y="4" width="20" height="12" stroke="var(--panel-text)" stroke-width="1" fill="none"/>
            <rect x="18" y="7" width="12" height="6" fill="var(--panel-text)" opacity="0.15"/>
            <rect x="24" y="22" width="10" height="5" fill="var(--gold)" opacity="0.5"/>
            <line x1="14" y1="24" x2="34" y2="24" stroke="var(--panel-text)" stroke-width="0.5" stroke-dasharray="2 2"/>
          </svg>
          <div class="drop-zone-text">拖拽文件至此 或 点击上传</div>
          <div class="drop-zone-hint">.txt .md .pdf · max 10MB</div>
          <input type="file" id="file-input" accept=".txt,.md,.pdf" style="display:none">
        </div>
        <div class="doc-list" id="doc-list"></div>
      </div>
      <!-- SEARCH -->
      <div class="tab-panel" id="panel-search">
        <div class="search-input-row">
          <input class="search-input" id="search-input" placeholder="检索理论语料..." onkeydown="if(event.key==='Enter')runSearch()">
          <button class="search-btn" onclick="runSearch()">
            <svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4" stroke="currentColor" stroke-width="1" fill="none"/><line x1="10" y1="10" x2="14" y2="14" stroke="currentColor" stroke-width="1"/></svg>
          </button>
        </div>
        <div id="search-results">
          <div class="no-data">输入关键词检索</div>
        </div>
      </div>
    </div>
  </aside>
</div>

<!-- FOOTER / TELEMETRY -->
<footer class="footer">
  <div class="footer-item"><span class="footer-dot ok" id="sys-dot"></span> SYS:<span id="sys-status">OK</span></div>
  <span class="footer-sep">│</span>
  <div class="footer-item"><span class="footer-dot ok" id="db-dot"></span> DB</div>
  <span class="footer-sep">│</span>
  <div class="footer-item">MODEL:<span id="model-name">--</span></div>
  <span class="footer-sep">│</span>
  <div class="footer-item">T:<span id="temp-val">0.3</span></div>
  <span class="footer-sep">│</span>
  <div class="footer-item">
    <svg viewBox="0 0 16 16" fill="none" style="width:12px;height:12px"><rect x="2" y="2" width="12" height="12" stroke="currentColor" stroke-width="0.8" fill="none"/><rect x="5" y="2" width="6" height="5" stroke="currentColor" stroke-width="0.5" fill="none"/><rect x="10" y="9" width="3" height="2" fill="var(--gold)" opacity="0.5"/></svg>
    LOCAL
  </div>
</footer>

<script>
const API = '';
const output = document.getElementById('output');
const emptyState = document.getElementById('empty-state');
const inputText = document.getElementById('input-text');
let projectId = 'web-session';
let participantId = 'web-user';
let runCounter = 0;
let initialized = false;
let selectedFile = null;

const filePickBtn = document.getElementById('file-pick-btn');
const analysisFileInput = document.getElementById('analysis-file-input');
const fileNameDisplay = document.getElementById('file-name-display');
const fileClearBtn = document.getElementById('file-clear-btn');

filePickBtn.addEventListener('click', () => analysisFileInput.click());
analysisFileInput.addEventListener('change', () => {
  if (analysisFileInput.files.length) {
    selectedFile = analysisFileInput.files[0];
    fileNameDisplay.textContent = selectedFile.name;
    fileNameDisplay.classList.add('has-file');
    fileClearBtn.classList.add('visible');
  }
});
fileClearBtn.addEventListener('click', () => {
  selectedFile = null;
  analysisFileInput.value = '';
  fileNameDisplay.textContent = '未选择文件';
  fileNameDisplay.classList.remove('has-file');
  fileClearBtn.classList.remove('visible');
});

function getAnalysisFile() {
  if (selectedFile) return selectedFile;
  const text = inputText.value.trim();
  if (!text) return null;
  return new Blob([text], {type: 'text/plain'});
}
function getAnalysisFileName() {
  if (selectedFile) return selectedFile.name;
  return 'input.txt';
}

// ── INIT ──
async function init() {
  try {
    const r = await fetch(`${API}/health`);
    if (r.ok) {
      document.getElementById('sys-dot').className = 'footer-dot ok';
      document.getElementById('sys-status').textContent = 'OK';
    }
  } catch {
    document.getElementById('sys-dot').className = 'footer-dot err';
    document.getElementById('sys-status').textContent = 'ERR';
  }
  try {
    await fetch(`${API}/api/v1/projects`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({id: projectId})
    });
    await fetch(`${API}/api/v1/participants`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({id: participantId, project_id: projectId})
    });
    initialized = true;
  } catch {}
  loadPerspectives();
}

// ── TAB SWITCHING ──
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
}

// ── PERSPECTIVES ──
async function loadPerspectives() {
  const panel = document.getElementById('panel-perspectives');
  try {
    const r = await fetch(`${API}/api/v1/perspectives`);
    const data = await r.json();
    const perspectives = data.perspectives || [];
    panel.innerHTML = '';
    perspectives.forEach(p => {
      const cls = p.id === 'lacan' ? 'lacan' : p.id === 'deleuze' ? 'deleuze' : '';
      const symbol = p.id === 'lacan' ? '[$]' : p.id === 'deleuze' ? '[Ag]' : '[?]';
      const card = document.createElement('div');
      card.className = `persp-card ${cls}`;
      card.innerHTML = `
        <div class="persp-name">${p.name || p.id}<span class="persp-symbol">${symbol}</span></div>
        <div class="persp-concepts">${(p.concepts||[]).map(c => `<span class="concept-tag">${c}</span>`).join('')}</div>
        ${(p.blind_spots||[]).map(b => `<div class="persp-blind">${b}</div>`).join('')}
      `;
      panel.appendChild(card);
    });
    if (!perspectives.length) panel.innerHTML = '<div class="no-data">NO PERSPECTIVES</div>';
  } catch {
    panel.innerHTML = '<div class="no-data">FETCH ERROR</div>';
  }
}

// ── ANALYZE ──
async function runAnalyze() {
  const file = getAnalysisFile();
  if (!file) return;
  const displayName = selectedFile ? `[${selectedFile.name}]` : '';
  const text = selectedFile ? selectedFile.name : inputText.value.trim();
  clearEmpty();
  setBusy(true);
  addUserMsg(displayName ? displayName : text);
  showLoading('ANALYZING...');
  try {
    const iid = 'run-' + (++runCounter);
    const form = new FormData();
    form.append('project_id', projectId);
    form.append('file', file, getAnalysisFileName());
    const uploadRes = await fetch(`${API}/api/v1/participants/${participantId}/sources`, {method: 'POST', body: form});
    if (!uploadRes.ok) { removeLoading(); addCard('error', 'ERR', '上传失败: ' + uploadRes.status, ''); setBusy(false); return; }
    const uploadData = await uploadRes.json();
    const sid = uploadData.id;
    const rr = await fetch(`${API}/api/v1/analysis-runs`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({project_id: projectId, participant_id: participantId, source_ids: [sid], idempotency_key: iid})
    });
    if (!rr.ok) { removeLoading(); addCard('error', 'ERR', '分析启动失败: ' + rr.status, ''); setBusy(false); return; }
    const run = await rr.json();
    const rid = run.run_id;
    let tries = 0;
    while (tries++ < 60) {
      await sleep(1500);
      const sr = await fetch(`${API}/api/v1/analysis-runs/${rid}`);
      const rd = await sr.json();
      if (rd.state === 'APPROVED' || rd.state === 'COMPILED') {
        const pr = await fetch(`${API}/api/v1/analysis-runs/${rid}/packet`);
        const packet = await pr.json();
        removeLoading();
        renderPacket(packet);
        break;
      }
      if (rd.state === 'FAILED' || rd.state === 'NEEDS_HUMAN_REVIEW') {
        removeLoading();
        if (rd.state === 'NEEDS_HUMAN_REVIEW') {
          const pr2 = await fetch(`${API}/api/v1/analysis-runs/${rid}/packet`);
          const pkt = await pr2.json();
          renderPacket(pkt);
        } else {
          addCard('error', 'ERR', '分析失败: ' + (rd.errors||[]).map(e=>e.message||e).join('; '), '');
        }
        break;
      }
    }
  } catch (e) {
    removeLoading();
    addCard('error', 'ERR', e.message, '');
  }
  setBusy(false);
}

// ── DIALECTICAL ──
async function runDialectical() {
  const file = getAnalysisFile();
  if (!file) return;
  const displayName = selectedFile ? `[${selectedFile.name}]` : '';
  const text = selectedFile ? selectedFile.name : inputText.value.trim();
  clearEmpty();
  setBusy(true);
  addUserMsg(displayName ? `▸▸ ${displayName}` : text);
  showPhaseBar();
  try {
    const iid = 'dial-' + (++runCounter);
    const form = new FormData();
    form.append('project_id', projectId);
    form.append('file', file, getAnalysisFileName());
    const uploadRes = await fetch(`${API}/api/v1/participants/${participantId}/sources`, {method: 'POST', body: form});
    if (!uploadRes.ok) { removePhaseBar(); addCard('error', 'ERR', '上传失败: ' + uploadRes.status, ''); setBusy(false); return; }
    const uploadData = await uploadRes.json();
    const sid = uploadData.id;
    const rr = await fetch(`${API}/api/v1/dialectical/run`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        project_id: projectId,
        participant_id: participantId,
        source_ids: [sid],
        perspective_ids: ['lacan', 'deleuze'],
        idempotency_key: iid,
        generate_report: true
      })
    });
    if (!rr.ok) { removePhaseBar(); addCard('error', 'ERR', '辩证分析请求失败: ' + rr.status, ''); setBusy(false); return; }
    const result = await rr.json();
    removePhaseBar();
    renderDialectical(result);
  } catch (e) {
    removePhaseBar();
    addCard('error', 'ERR', e.message, '');
  }
  setBusy(false);
}

// ── RENDER PACKET ──
function renderPacket(packet) {
  const obs = packet.observations || [];
  const hyps = packet.hypotheses || [];
  if (obs.length) addSectionTitle('OBSERVATIONS');
  obs.forEach((o, i) => {
    const reg = (o.register_markers||[]).join(' ') || o.rsi_register || '';
    addCard('obs', `OBS-${String(i+1).padStart(3,'0')}`, o.label || '', reg);
  });
  if (hyps.length) addSectionTitle('HYPOTHESES');
  hyps.forEach((h, i) => {
    const st = h.status || 'provisional';
    const meta = `status: ${st}`;
    const concepts = (h.concept_ids||[]).join(', ');
    const extra = concepts ? `concepts: ${concepts}` : '';
    addCard('hyp', `HYP-${String(i+1).padStart(3,'0')}`, h.id || '', meta, extra);
  });
}

// ── RENDER DIALECTICAL ──
function renderDialectical(result) {
  const p1 = result.phase1_analyses || [];
  const p2 = result.phase2_cross_critiques || [];
  const p3 = result.phase3_synthesis;
  const p4 = result.phase4_report;

  if (p1.length) addSectionTitle('PHASE 1 · 独立分析');
  p1.forEach(a => {
    const pid = a.perspective_id || '?';
    const sym = pid === 'lacan' ? '[$]' : '[Ag]';
    (a.observations||[]).forEach((o, i) => {
      addCard('obs', `${pid} OBS-${i+1}`, o.label || '', sym);
    });
    (a.hypotheses||[]).forEach((h, i) => {
      addCard('hyp', `${pid} HYP-${i+1}`, h.id || '', sym);
    });
  });

  if (p2.length) addSectionTitle('PHASE 2 · 交叉批判');
  p2.forEach(c => {
    const from = c.source_perspective_id || '?';
    const to = c.target_perspective_id || '?';
    (c.counterexamples||[]).forEach((x, i) => {
      addCard('cross', `${from}→${to} CEX-${i+1}`, typeof x === 'string' ? x : (x.text || JSON.stringify(x)), '');
    });
    (c.blind_spot_alerts||[]).forEach((b, i) => {
      addCard('cross', `${from}→${to} BLIND-${i+1}`, typeof b === 'string' ? b : JSON.stringify(b), '⚠ BLIND SPOT');
    });
    (c.epistemic_gaps||[]).forEach((g, i) => {
      addCard('cross', `${from}→${to} GAP-${i+1}`, typeof g === 'string' ? g : JSON.stringify(g), '');
    });
  });

  if (p3) {
    addSectionTitle('PHASE 3 · 综合');
    (p3.convergence||[]).forEach((c, i) => {
      addCard('synth', `CONV-${i+1}`, typeof c === 'string' ? c : JSON.stringify(c), '收敛');
    });
    (p3.divergence||[]).forEach((d, i) => {
      addCard('synth', `DIV-${i+1}`, typeof d === 'string' ? d : JSON.stringify(d), '发散');
    });
    (p3.unique_insights||[]).forEach((u, i) => {
      addCard('synth', `INS-${i+1}`, typeof u === 'string' ? u : JSON.stringify(u), '洞见');
    });
  }

  if (p4) {
    addSectionTitle('PHASE 4 · 报告');
    addCard('synth', 'REPORT', p4, 'FINAL');
  }
}

// ── SEARCH ──
async function runSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;
  const results = document.getElementById('search-results');
  results.innerHTML = '<div class="no-data">SEARCHING...</div>';
  try {
    const r = await fetch(`${API}/api/v1/theory/search?project_id=${projectId}&q=${encodeURIComponent(q)}&limit=5`);
    const data = await r.json();
    const items = data.items || [];
    if (!items.length) {
      results.innerHTML = '<div class="no-data">NO DATA FOUND</div>';
      return;
    }
    results.innerHTML = '';
    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'search-result';
      const text = item.excerpt || item.text || item.snippet || '';
      const highlighted = text.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'), '<mark>$1</mark>');
      div.innerHTML = `<div class="search-result-id">${item.id || item.doc_id || '?'}</div><div>${highlighted}</div>`;
      results.appendChild(div);
    });
  } catch {
    results.innerHTML = '<div class="no-data">FETCH ERROR</div>';
  }
}

// ── FILE UPLOAD ──
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files.length) uploadFile(fileInput.files[0]); });

async function uploadFile(file) {
  const form = new FormData();
  form.append('project_id', projectId);
  form.append('file', file);
  try {
    const r = await fetch(`${API}/api/v1/theory/sources`, {method: 'POST', body: form});
    if (r.ok) {
      const data = await r.json();
      addDocItem(data.id || file.name, file.type || 'unknown');
      dropZone.querySelector('.drop-zone-text').textContent = '写入完成 ✓';
      setTimeout(() => { dropZone.querySelector('.drop-zone-text').textContent = '拖拽文件至此 或 点击上传'; }, 2000);
    }
  } catch {}
}

function addDocItem(id, type) {
  const list = document.getElementById('doc-list');
  const div = document.createElement('div');
  div.className = 'doc-item floppy-anim';
  div.innerHTML = `<span class="doc-id">${id}</span><span class="doc-type">${type}</span>`;
  list.prepend(div);
}

// ── DOM HELPERS ──
function clearEmpty() { if (emptyState) emptyState.remove(); }

function addUserMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg-user';
  div.textContent = text;
  output.appendChild(div);
  scrollOutput();
  inputText.value = '';
}

function addSectionTitle(text) {
  const div = document.createElement('div');
  div.className = 'section-title';
  div.textContent = text;
  output.appendChild(div);
  scrollOutput();
}

function addCard(type, tag, text, meta, extra) {
  const div = document.createElement('div');
  div.className = `card ${type === 'obs' ? '' : type}`;
  div.innerHTML = `
    <div class="card-tag"><span class="dot"></span>${tag}</div>
    <div class="card-text">${escHtml(text)}</div>
    ${meta ? `<div class="card-meta">${meta}${extra ? ' · ' + extra : ''}</div>` : ''}
  `;
  output.appendChild(div);
  scrollOutput();
}

function showLoading(text) {
  const div = document.createElement('div');
  div.className = 'loading';
  div.id = 'loading-indicator';
  div.innerHTML = `<span class="loading-dot"></span>${text}
    <svg viewBox="0 0 20 20" fill="none" style="width:16px;height:16px;margin-left:4px;opacity:0.5">
      <rect x="2" y="2" width="16" height="16" stroke="currentColor" stroke-width="1" fill="none"/>
      <rect x="6" y="2" width="8" height="6" stroke="currentColor" stroke-width="0.6" fill="none"/>
      <rect x="11" y="10" width="4" height="3" fill="var(--gold)" opacity="0.5"/>
    </svg>`;
  output.appendChild(div);
  scrollOutput();
}

function removeLoading() {
  const el = document.getElementById('loading-indicator');
  if (el) el.remove();
}

function showPhaseBar() {
  const wrap = document.createElement('div');
  wrap.id = 'phase-indicator';
  wrap.innerHTML = `
    <div class="phase-label">
      <span class="active">PHASE 1</span><span>PHASE 2</span><span>PHASE 3</span><span>PHASE 4</span>
    </div>
    <div class="phase-bar">
      <div class="phase-step active"></div>
      <div class="phase-step"></div>
      <div class="phase-step"></div>
      <div class="phase-step"></div>
    </div>`;
  output.appendChild(wrap);
  scrollOutput();
  animatePhases();
}

function animatePhases() {
  const steps = document.querySelectorAll('#phase-indicator .phase-step');
  const labels = document.querySelectorAll('#phase-indicator .phase-label span');
  let phase = 0;
  const iv = setInterval(() => {
    if (phase >= 4) { clearInterval(iv); return; }
    steps.forEach((s, i) => {
      s.className = 'phase-step' + (i < phase ? ' done' : i === phase ? ' active' : '');
    });
    labels.forEach((l, i) => {
      l.className = (i < phase ? 'done' : i === phase ? 'active' : '');
    });
    phase++;
  }, 4000);
}

function removePhaseBar() {
  const el = document.getElementById('phase-indicator');
  if (el) el.remove();
}

function setBusy(busy) {
  document.getElementById('btn-analyze').disabled = busy;
  document.getElementById('btn-dialectical').disabled = busy;
}

function scrollOutput() { output.scrollTop = output.scrollHeight; }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ── BOOT ──
init();
</script>
</body>
</html>
